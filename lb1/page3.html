<!DOCTYPE html>
<html lang="uk">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Inline-блоки</title>
	<style>
		* { box-sizing: border-box; }

		body {
			margin: 5px;
			background: #f4f4f4;
		}

		.frame {
			width: 112px;
			border: 1px solid #222;
			box-shadow: 2px 2px 2px #777;
			font-size: 0;
		}

		.bar {
			display: inline-block;
			width: 110px;
			height: 20px;
			padding-left: 9px;
			background: #06f;
			color: #fff;
			font: bold 12px/18px "Times New Roman", serif;
			vertical-align: top;
		}

		.column {
			display: inline-block;
			height: 100px;
			color: #111;
			font: bold 12px/98px "Times New Roman", serif;
			text-align: center;
			vertical-align: top;
		}

		.left, .right { background: #ffcc00; }
		.left {
			width: 32px;
			border: 1px solid #222;
		}
		.center {
			width: 48px;
			border-top: 1px solid #222;
			border-bottom: 1px solid #222;
			background: #fff;
		}
		.right {
			width: 30px;
			border: 1px solid #222;
		}
	</style>
</head>
<body>
	<div class="frame">
		<div class="bar">1</div><br>
		<div class="column left">5</div><div class="column center">4</div><div class="column right">2</div><br>
		<div class="bar">3</div>
	</div>
</body>
</html>
