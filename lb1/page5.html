	<main>
		<section class="intro">
			<h5>Завдання 5. Створіть форму користувача</h5>
		</section> 
		<section class="form-card">
			<h2>Форма користувача</h2>
			<div class="field">
				<form action="#" method="post">
				<p>
					<label for="user_name">Прізвище, ім’я, по батькові</label>
					<input type="text" id="user_name" name="user_name" placeholder="Антоненко Єлизавета Іванівна" required>
				</p>
			</div>
			<div class="field">
				<p>
					<label for="user_email">E-mail</label>
					<input type="email" id="user_email" name="user_email" placeholder="example@email.com">
				</p>
			</div>
			<div class="field">
				<p>
					<label for="user_birthdate">Дата народження</label>
					<input type="date" id="user_birthdate" name="user_birthdate" placeholder="Рік-місяць-день" required>
				</p>
			</div>
			<fieldset class="field gender">
            	<legend>Стать</legend>
            		<label class="choice">
						<input type="radio" name="user_sex" value="Чоловіча" required>
						<span>Чоловіча</span>
					</label>
					<label class="choice">
						<input type="radio" name="user_sex" value="Жіноча" required>
						<span>Жіноча</span>
					</label>
        	</fieldset>
			<p>
				<button type="submit" class="btn-submit">Надіслати</button>
			</p>
				</form>
		</section>
	</main>
	<footer>© 2026 · Студентка групи І-23 - Антоненко Єлизавета </footer>
